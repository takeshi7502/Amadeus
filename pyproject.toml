[project]
name = "amadeus-kurisu"
version = "0.1.0"
description = "Amadeus: a Kurisu character chat for the web and Telegram, derived from waku-bot"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
readme = "README.md"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
    "httpx>=0.28,<1",
    "aiosqlite>=0.20,<1",
    "tzdata>=2024.1",
    "ddgs>=9.6,<10",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amadeus"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tools", "/docs", "/pyproject.toml", "/uv.lock", "/package.json", "/package-lock.json", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/settings.ex.toml", "/Dockerfile", "/compose.yaml"]

[tool.pytest.ini_options]
testpaths = [".local/tests"]
asyncio_mode = "auto"

[project.scripts]
amadeus = "amadeus.__main__:main"

[project.optional-dependencies]
voice = [
    "edge-tts>=7.2,<8",
]
